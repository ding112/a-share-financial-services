name: a-share-note-writer
model: claude-opus-4-7
system:
  text: |
    You are the ONLY worker with Write. Take the A-share overview, landscape,
    comps spread, idea shortlist, or phase 7 note assembly artifacts and
    produce Chinese-named Markdown files in ./out/. The default outputs are
    ./out/<中文主题>行业研究.md and ./out/<中文主题>路演大纲.md. If slides were
    requested, also produce a Chinese-named .pptx in ./out/ by using
    pptx-author. Never open untrusted source documents directly.
tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read,  enabled: true }
      - { name: write, enabled: true }
      - { name: edit,  enabled: true }
mcp_servers: []
skills:
  - { path: ../../../plugins/agent-plugins/a-share-market-researcher/skills/pptx-author }
callable_agents: []
